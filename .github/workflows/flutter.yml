name: Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  ios-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign
      - run: flutter build ios --simulator --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app md-photo-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: md-photo-ios-simulator
          path: md-photo-ios-simulator.zip
          if-no-files-found: error
          retention-days: 30
